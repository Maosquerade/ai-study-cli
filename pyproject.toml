[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-study-cli"
version = "0.1.0"
description = "A terminal-first AI study assistant with Socratic learning workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "platformdirs>=4.2.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
]

[project.scripts]
learn = "ai_study.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_study"]
